name: Fix Node badge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-node-badge.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update README badges
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'Node.js-%3E%3D20.0.0-brightgreen'
          new = 'Node.js-%3E%3D20.19.0-brightgreen'
          for name in ('README.md', 'README.en.md'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{name}: old badge not found')
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-node-badge.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md .github/workflows/fix-node-badge.yml
          git commit -m "docs: align Node version badge"
          git push origin HEAD:main
